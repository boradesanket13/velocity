include classpath("application.conf")

# "*" makes ElasticMQ build queue URLs from the Host header of each request, so the URL a
# container receives (http://elasticmq:9324/...) is reachable from that container.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

queues {
  webhost-builds {
    # must outlive the longest build (BUILD_TIMEOUT_SECONDS + margin)
    defaultVisibilityTimeout = 20 minutes
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "webhost-builds-dlq"
      maxReceiveCount = 3
    }
  }
  webhost-builds-dlq { }
}
